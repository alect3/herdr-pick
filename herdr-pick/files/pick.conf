# herdr-pick configuration. This file is plain shell, sourced by both
# herdr-pick and pick-repos-refresh at startup. It is all optional: with
# everything commented out, projects live in ~/projects, the repo cache
# lists the authenticated gh user's repos, and typed bare names create
# under ~/projects with a private repo under your own account.
#
# Override the path with HERDR_PICK_CONF. The Salt formula and install.sh
# seed this file but never overwrite an existing one, your edits stick.

# --- destinations (PICK_SITES) ------------------------------------------
# An array of "name:dir:owner" entries. Each entry contributes:
#
#   name   a create prefix you can type in the picker, matched
#          case-insensitively ("work/api" → the "work" site). The FIRST
#          site is also where bare names create, and its dir is where
#          repos of owners with no explicit mapping clone to.
#   dir    a parent directory scanned for the local tier (first site with
#          a dir wins a basename clash) and the clone destination for
#          that site's owner.
#   owner  the GitHub owner that auto-created repos under this prefix
#          belong to. "-" = local only (git init, no remote); empty = the
#          default owner (PICK_DEFAULT_OWNER, else your authenticated gh
#          user, else local only).
#
# A three-namespace setup, mirroring the layout this tool was extracted
# from (personal / org / sandbox):
#
# PICK_SITES=(
#   "projects:$HOME/projects:"          # bare names: ~/projects, your repo
#   "work:$HOME/work:acme-org"          # work/…:    ~/work, acme-org repo
#   "w:$HOME/work:acme-org"             # shorthand for the same site
#   "r:$HOME/sandbox:-"                 # r/…:       ~/sandbox, local only
# )

# --- repo cache owners (PICK_OWNERS) -------------------------------------
# Owners listed by pick-repos-refresh (the "↓ clonable" tier), in
# precedence order: earlier owners win a basename clash in the picker.
# Empty = your authenticated gh user.
#
# PICK_OWNERS=(you acme-org)

# --- clone-dir overrides (PICK_OWNER_DIR) ---------------------------------
# Where repos of a given owner clone, when the site table does not
# already imply it (the first site owned by <owner> wins otherwise).
#
# PICK_OWNER_DIR[acme-org]="$HOME/work"

# --- default repo owner (PICK_DEFAULT_OWNER) ------------------------------
# Owner for sites with an empty owner field. Unset = `gh api user`
# (queried lazily, only when a create is actually requested).
#
# PICK_DEFAULT_OWNER=you

# --- editor pane command (PICK_EDIT_CMD) ----------------------------------
# Command run in the right-hand editor pane of an opened workspace (the
# left pane stays an empty shell for your coding agent). Default: "nvim ."
# when nvim is installed, otherwise nothing. Skipped when the command's
# binary is missing; set it empty for a plain shell pane.
#
# PICK_EDIT_CMD="nvim ."
