name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: |
          shellcheck herdr-pick/files/herdr-pick.sh \
                    herdr-pick/files/pick-repos-refresh.sh \
                    install.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jq stays real in the dispatch tests: it parses the stub herdr
      # responses, so a jq-side regression fails loudly.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: |
          git clone --depth 1 -b v1.12.0 \
            https://github.com/bats-core/bats-core /tmp/bats-core
          /tmp/bats-core/bin/bats test/
